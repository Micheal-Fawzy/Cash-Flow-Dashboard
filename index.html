<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cash Flow Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Add Babel for in-browser JSX/TSX transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Dependencies are now loaded via importmap -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "recharts": "https://aistudiocdn.com/recharts@^3.3.0",
        "xlsx": "https://cdn.sheetjs.com/xlsx-latest/package/xlsx.mjs"
      }
    }
    </script>

    <style>
      body {
        font-family: 'Cairo', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Custom Scrollbar for a more polished UI, compatible with dark mode */
      ::-webkit-scrollbar {
        width: 12px;
        height: 12px;
      }

      ::-webkit-scrollbar-track {
        background: #f1f5f9; /* slate-100 */
      }

      html.dark ::-webkit-scrollbar-track {
          background: #1e293b; /* slate-800 */
      }

      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; /* slate-300 */
        border-radius: 6px;
        border: 3px solid #f1f5f9; /* slate-100 */
      }

      html.dark ::-webkit-scrollbar-thumb {
          background: #475569; /* slate-600 */
          border-color: #1e293b; /* slate-800 */
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; /* slate-400 */
      }

      html.dark ::-webkit-scrollbar-thumb:hover {
          background: #64748b; /* slate-500 */
      }

      /* Improved focus rings for better accessibility */
      :focus-visible {
        outline: 2px solid #2dd4bf; /* teal-400 */
        outline-offset: 2px;
        border-radius: 4px;
      }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-100 dark:bg-gray-900">
    <div id="root"></div>
    <!-- Load the application entry point -->
    <script type="text/babel" data-presets="react,typescript" src="index.tsx"></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
